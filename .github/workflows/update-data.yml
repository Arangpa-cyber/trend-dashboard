name: 데이터 갱신

on:
  schedule:
    # 화-토 00:30 UTC = 한국시간 오전 9:30, 미국 동부 겨울 19:30 · 여름 20:30
    # 스크립트가 동부 20:15(시간외 거래 마감 15분 뒤)까지 기다렸다 받음. GitHub 예약은 보통 1시간쯤 늦게 시작해
    # 실제로는 한국시간 오전 10:30-11:00 무렵 반영. 거래량이 안 맞으면 15분 간격으로 다시 확인(최대 1시간)
    # 예전 21:10 UTC는 서머타임이 끝나면 장 마감 10분 뒤라 집계 중인 거래량이 들어온 적이 있음(2026-11-02 QQQ 79만 주)
    - cron: "30 0 * * 2-6"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세·실적 받기
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/build_data.py
      - name: data.json 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "데이터 갱신 $(date -u +%F)" || echo "바뀐 것 없음"
          # 실행 중에 다른 커밋(index.html 수정 등)이 올라왔으면 그 위에 얹어서 올림
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          git push   # 세 번 다 실패했으면 여기서 실패로 표시됨
