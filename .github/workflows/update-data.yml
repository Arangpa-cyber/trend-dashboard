name: 데이터 갱신

on:
  schedule:
    # 평일 21:10 UTC = 미국 동부 서머타임 17:10, 겨울 16:10 (모두 장 마감 뒤)
    # 한국시간 화-토 오전 06:10 (GitHub 사정으로 몇십 분 늦게 시작할 수 있음)
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세·실적 받기
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python scripts/build_data.py
      - name: data.json 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "데이터 갱신 $(date -u +%F)" || echo "바뀐 것 없음"
          git push
