name: 데이터 갱신

on:
  schedule:
    # 화-토 01:30 UTC = 한국시간 오전 10:30, 미국 동부 겨울 20:30 · 여름 21:30 (전날 장의 시간외 거래까지 끝난 뒤)
    # 거래량이 확정된 뒤에 받기 위함. 예전 21:10 UTC는 서머타임이 끝나면 장 마감 10분 뒤라
    # ETF 거래량이 집계 중인 값으로 들어온 적이 있음(2026-11-02 QQQ 79만 주)
    - cron: "30 1 * * 2-6"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세·실적 받기
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python scripts/build_data.py
      - name: data.json 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "데이터 갱신 $(date -u +%F)" || echo "바뀐 것 없음"
          # 실행 중에 다른 커밋(index.html 수정 등)이 올라왔으면 그 위에 얹어서 올림
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          git push   # 세 번 다 실패했으면 여기서 실패로 표시됨
